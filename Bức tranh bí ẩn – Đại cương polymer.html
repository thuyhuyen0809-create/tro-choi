<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bức tranh bí ẩn – Đại cương polymer</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--tx:#2b2230;--mut:#7a6d80;--bd:#eadfd5;--gray:#d9d3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1824;--card:#2a2332;--tx:#f3edf6;--mut:#b3a7bb;--bd:#43394d;--gray:#4a4054}}
:root[data-theme="dark"]{--bg:#1d1824;--card:#2a2332;--tx:#f3edf6;--mut:#b3a7bb;--bd:#43394d;--gray:#4a4054}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 28px}
h1{font-size:1.5rem;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 16px;font-size:.95rem}
.grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.pic,.qa{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.pic{flex:1 1 100%}.qa{flex:1.3 1 320px}
svg{width:100%;height:auto;display:block}
.pic{background:#0b140e;border-color:#16301f}
.mx{display:grid;grid-template-columns:repeat(39,1fr);gap:1px;container-type:inline-size}
.c{aspect-ratio:1;background:#0f1f14;color:#2f8a55;font:700 2.3cqw/1 ui-monospace,Consolas,monospace;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:background .8s,opacity 1s,color .8s,transform .8s}
.c.on{color:transparent}
.win .c:not(.s){opacity:.07}
.win .c.s{transform:scale(1.08);border-radius:3px}
.prog{text-align:center;font-size:.9rem;color:#8fbf9f;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer;font-size:1rem}
.chip.cur{border-color:var(--tx)}.chip.done{color:#fff;border-color:transparent}
.qt{font-size:1.05rem;font-weight:600;margin:6px 0 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--tx)}.opt:disabled{cursor:default;opacity:.85}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
.cn{font-size:.78rem;color:var(--mut);display:block}
.opt.bad{animation:sh .35s;border-color:#d32f2f}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem;min-height:1px}
.fb.ok{background:rgba(67,160,71,.15)}.fb.no{background:rgba(229,57,53,.13)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.final{display:none;text-align:center;color:#e8f5ec;margin-top:12px;font-weight:700;font-size:1.05rem}
.win ~ .final,.final.on{display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>🎨 Bức tranh bí ẩn</h1>
<p class="sub">Đại cương về polymer – Hóa học 12 · Mỗi đáp án ứng với một màu. Mỗi câu đúng sẽ tô màu một phần ma trận – đúng cả 7 câu để hiện bức tranh!</p>
<div class="grid">
<div class="pic">
<div class="mx" id="svg" role="img" aria-label="Ma trận bí ẩn"></div>
<div class="prog" id="prog"></div>
<div class="final" id="fin">🎉 Chúc mừng! Bức tranh là “20 ❤ 11” – Chúc mừng Ngày Nhà giáo Việt Nam! 🌸</div>
</div>
<div class="qa">
<div class="chips" id="chips"></div>
<div class="qt" id="qt"></div>
<div id="opts"></div>
<div class="fb" id="fb"></div>
<div class="btns" style="color:var(--mut);font-size:.85rem">Mỗi câu chỉ được trả lời một lần.</div>
</div>
</div>
</div>
<script>
var C={R:["#e53935","Đỏ"],O:["#fb8c00","Cam"],Y:["#fdd835","Vàng"],G:["#43a047","Lục"],B:["#1e88e5","Lam"],P:["#8e24aa","Tím"],K:["#ec407a","Hồng"]};
var Q=[
{q:"Polymer là gì?",o:[["Hợp chất hữu cơ có phân tử khối nhỏ, chỉ chứa một mắt xích","G"],["Hợp chất cao phân tử do nhiều mắt xích liên kết với nhau tạo nên","R"],["Hợp chất vô cơ có cấu tạo mạng tinh thể","B"],["Hỗn hợp nhiều chất hữu cơ có phân tử khối nhỏ","P"]],a:1,e:"Polymer là hợp chất có phân tử khối rất lớn do nhiều đơn vị nhỏ (mắt xích) liên kết với nhau tạo nên."},
{q:"Trong công thức (–CH₂–CH₂–)ₙ, giá trị n được gọi là gì?",o:[["Số nguyên tử carbon của monomer","Y"],["Hóa trị của polymer","K"],["Số liên kết đôi trong phân tử","G"],["Hệ số polymer hóa (độ polymer hóa)","O"]],a:3,e:"n là số mắt xích trong phân tử polymer, gọi là hệ số polymer hóa."},
{q:"Monomer dùng để điều chế polyethylene (PE) là chất nào?",o:[["CH₂=CH₂ (ethylene)","Y"],["CH≡CH (acetylene)","R"],["CH₂=CH–CH₃ (propylene)","B"],["CH₂=CHCl (vinyl chloride)","P"]],a:0,e:"PE được tạo ra từ phản ứng trùng hợp ethylene CH₂=CH₂."},
{q:"Polymer nào được điều chế bằng phản ứng trùng hợp CH₂=CHCl?",o:[["Polyethylene (PE)","O"],["Polystyrene (PS)","P"],["Poly(vinyl chloride) (PVC)","G"],["Polytetrafluoroethylene (Teflon)","K"]],a:2,e:"Trùng hợp vinyl chloride CH₂=CHCl thu được PVC."},
{q:"Một mẫu polyethylene có phân tử khối trung bình 28 000 amu. Hệ số polymer hóa n xấp xỉ bao nhiêu?",o:[["500","R"],["1000","B"],["2000","O"],["28","K"]],a:1,e:"Mắt xích –CH₂–CH₂– có khối lượng 28 nên n = 28 000 : 28 = 1000."},
{q:"Chất nào sau đây là polymer thiên nhiên?",o:[["Nylon-6,6","R"],["Poly(vinyl chloride)","O"],["Polyethylene","Y"],["Cellulose","P"]],a:3,e:"Cellulose có sẵn trong tự nhiên (bông, gỗ…); các chất còn lại là polymer tổng hợp."},
{q:"Phản ứng nào sau đây là phản ứng trùng ngưng?",o:[["Hexamethylenediamine + adipic acid → nylon-6,6 + H₂O","K"],["Ethylene → polyethylene","G"],["Vinyl chloride → PVC","B"],["Styrene → polystyrene","Y"]],a:0,e:"Trùng ngưng kèm theo giải phóng phân tử nhỏ (như H₂O); các phản ứng còn lại là trùng hợp."}
];
var done,bad,cur,IDX,SV=null,K="polymer-mystery-v1",bands=document.getElementById("svg");try{SV=JSON.parse(localStorage.getItem(K))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify({d:done,b:bad,idx:IDX}))}catch(e){}}
function nextQ(){for(var i=0;i<7;i++)if(!done[i]&&!bad[i])return i;return -1}
var F={2:[".###.","#...#","....#","...#.","..#..",".#...","#####"],0:[".###.","#...#","#..##","#.#.#","##..#","#...#",".###."],1:["..#..",".##..","..#..","..#..","..#..","..#..",".###."]},
H=[".##...##.","#########","#########","#########",".#######.","..#####..","...###..."],R=11,N=39,cells=[],grp=[],timer;
function build(){bands.innerHTML="";cells=[];var S=[];for(var r=0;r<R;r++)S.push([]);
function put(t,x){t.forEach(function(row,j){for(var k=0;k<row.length;k++)if(row[k]=="#")S[j+2][x+k]=1})}
put(F[2],2);put(F[0],8);put(H,15);put(F[1],26);put(F[1],32);
for(var i=0;i<R*N;i++){var d=document.createElement("div");d.className="c"+(S[Math.floor(i/N)][i%N]?" s":"");d.textContent=Math.random()<.5?"0":"1";bands.appendChild(d);cells.push(d)}
var idx=cells.map(function(_,i){return i});for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}if(SV&&SV.idx&&SV.idx.length==idx.length)idx=SV.idx;IDX=idx;
grp=[[],[],[],[],[],[],[]];idx.forEach(function(v,k){grp[k%7].push(v)});
clearInterval(timer);timer=setInterval(function(){for(var k=0;k<25;k++){var c=cells[Math.floor(Math.random()*cells.length)];if(!c.classList.contains("on"))c.textContent=Math.random()<.5?"0":"1"}},250)}
function paint(i){grp[i].forEach(function(v){var c=cells[v];c.style.transitionDelay=(Math.random()*.8)+"s";c.style.background=C[corr(i)][0];c.classList.add("on")})}
function corr(i){return Q[i].o[Q[i].a][1]}
function chips(){var h=document.getElementById("chips");h.innerHTML="";Q.forEach(function(_,i){var b=document.createElement("button");b.className="chip"+(i==cur?" cur":"")+(done[i]?" done":"")+(bad[i]?" done":"");b.textContent=i+1;if(done[i])b.style.background=C[corr(i)][0];if(bad[i]){b.style.background="#757575";b.textContent="✘"}b.onclick=function(){show(i)};h.appendChild(b)})}
function prog(){var n=done.filter(Boolean).length,w=bad.filter(Boolean).length,f=document.getElementById("fin");document.getElementById("prog").textContent="Đã tô màu "+n+"/7 phần ma trận";document.getElementById("svg").classList.toggle("win",n==7);if(n==7)clearInterval(timer);f.classList.toggle("on",n==7||n+w==7);if(n==7)f.textContent="🎉 Chúc mừng! Bức tranh là “20 ❤ 11” – Chúc mừng Ngày Nhà giáo Việt Nam! 🌸";else if(n+w==7){f.textContent="Rất tiếc, bạn trả lời sai "+w+" câu nên bức tranh chưa hiện ra. Mỗi câu chỉ được trả lời một lần.";clearInterval(timer)}}
function show(i){cur=i;chips();document.getElementById("qt").textContent="Câu "+(i+1)+". "+Q[i].q;var fb=document.getElementById("fb");fb.className="fb";fb.textContent="";var o=document.getElementById("opts");o.innerHTML="";
Q[i].o.forEach(function(x,k){var b=document.createElement("button");b.className="opt";b.disabled=!!(done[i]||bad[i]);b.innerHTML='<span class="dot" style="background:'+C[x[1]][0]+'"></span><span><span class="cn">Màu '+C[x[1]][1]+'</span>'+x[0]+'</span>';
b.onclick=function(){pick(i,k,b)};o.appendChild(b)});
if(done[i]){fb.className="fb ok";fb.textContent="✔ "+Q[i].e}if(bad[i]){fb.className="fb no";fb.textContent="✘ Bạn đã trả lời sai câu này và không được làm lại."}}
function pick(i,k,b){var fb=document.getElementById("fb");
if(k==Q[i].a){done[i]=true;paint(i);fb.className="fb ok";fb.textContent="✔ Chính xác! Một phần ma trận đã được tô màu "+C[corr(i)][1].toLowerCase()+". "+Q[i].e;chips();prog();save();
var all=document.querySelectorAll(".opt");all.forEach(function(x){x.disabled=true});
var nx=nextQ();if(nx>-1)setTimeout(function(){show(nx)},2600)}
else{bad[i]=true;b.classList.add("bad");document.querySelectorAll(".opt").forEach(function(x){x.disabled=true});fb.className="fb no";fb.textContent="✘ Chưa đúng. Bạn không được làm lại câu này – hãy sang câu tiếp theo.";chips();prog();save();var nx=nextQ();if(nx>-1)setTimeout(function(){show(nx)},2600)}}
function start(){done=SV&&SV.d||[0,0,0,0,0,0,0].map(Boolean);bad=SV&&SV.b||[0,0,0,0,0,0,0].map(Boolean);build();for(var i=0;i<7;i++)if(done[i]){grp[i].forEach(function(v){cells[v].style.background=C[corr(i)][0];cells[v].classList.add("on")})}prog();var n=nextQ();show(n>-1?n:0)}
start();
</script>
</body>
</html>
